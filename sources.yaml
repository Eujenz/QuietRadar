pipeline_settings:
  title_filter_enabled: true
  enable_two_stage_humanizer: false
  title_filter_mode: smart
  content_snippet_length: 900
  max_candidate_pool: 15
  serendipity_ratio: 0.28
  max_output_items: 10
  active_prompt_template: editorial
profile:
  # 讀者關注：同時供 LLM 選定主線，也會被拆成關鍵詞做標題相關性排序
  interests:
  - 產業利潤池轉移、商業模式重組、定價權
  - AI 商業化、落地成本、合規、資料主權
  - 基礎設施商品化、雲端、晶片、算力、開源模型
  - 平台權力、生態系競爭、標準之爭、監管
  - 跨領域科學與技術突破對產業的影響
  # 不感興趣：會被拆成關鍵詞，標題命中即在讀取正文前淘汰
  negative_topics:
  - 公關通稿、買榜、例行融資新聞稿
  - LeetCode、刷題、面試題、薪資行情、求職
  - 名人八卦、政治口水
  - 炒幣、空投、灰產
  - 代購、團購、物流出貨
output_template:
  header: "> 出刊時間：{time} ｜ 本期精選：{count} 則\n---\n"
  overview: "{overview}\n\n---\n"
  group_header: "{source} ({count} 則)"
  item_format: "{index}. [{title}]({url})"
  footer: "---"
